name: AFGL Tournament Monitor

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  monitor:
    # Runs on a self-hosted runner at home: the AFGL site is behind AWS WAF,
    # which challenges GitHub-hosted (datacenter) IPs. A residential IP passes.
    runs-on: [self-hosted, afgl]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # No setup-node step: on a self-hosted Raspberry Pi runner, Node is
    # pre-installed as part of the runner host (Node 18+ LTS). This avoids
    # per-run architecture downloads that are fragile on ARM.
    - name: Verify Node.js
      run: node --version

    - name: Install dependencies
      run: npm ci

    - name: Monitor AFGL tournament schedule
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        TARGET_URL: 'https://afgl.bluegolf.com/bluegolf/afgl26/schedule/index.htm'
      run: node monitor.js

    - name: Commit tournament data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add tournaments.json tournament_count.txt
        git diff --staged --quiet || git commit -m "Update AFGL tournament data"
        git push
